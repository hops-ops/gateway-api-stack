apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: gateway-api-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.5'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-helm
    version: '>=v1'
  description: Installs Kubernetes Gateway API CRDs (gateway.networking.k8s.io) onto
    a target cluster as a Helm release. Cloud-neutral, prereq for any Gateway API
    based controller (Istio Ambient, Envoy Gateway, etc.) or integration (knative
    net-gateway-api, ExternalDNS gateway-httproute source).
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # gateway-api-stack

    Single-claim install of the Kubernetes Gateway API CRDs
    (gateway.networking.k8s.io) onto a target cluster as one Helm release.

    Composes:
    - gateway-api-crds Helm release (chart: wiremind/gateway-api-crds —
      community-maintained wrapper for upstream CRDs from
      kubernetes-sigs/gateway-api).

    Prereq for any stack or controller that consumes Gateway API CRDs:
    istio-stack (ambient), knative-stack (net-gateway-api), cloudflare-dns-stack
    and aws-dns-stack (ExternalDNS gateway-httproute source).
  repository: ghcr.io/hops-ops/gateway-api-stack
  source: github.com/hops-ops/gateway-api-stack
