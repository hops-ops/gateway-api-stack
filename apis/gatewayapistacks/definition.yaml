apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: gatewayapistacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: GatewayAPIStack
    plural: gatewayapistacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: GatewayAPIStack installs the Kubernetes Gateway API CRDs (gateway.networking.k8s.io) onto a target cluster as a Helm release. Prereq for any Gateway API based controller (Istio Ambient, Envoy Gateway, etc.) or integration (knative net-gateway-api, ExternalDNS gateway-httproute source).
        type: object
        properties:
          spec:
            description: GatewayAPIStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for helmProviderConfigRef.name and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              namespace:
                description: Namespace for the Helm release. Defaults to "gateway-api".
                type: string
              releaseName:
                description: Helm release name. Defaults to "gateway-api-crds".
                type: string
              chartVersion:
                description: Version of the wiremind/gateway-api-crds chart. The chart's appVersion tracks the upstream Gateway API release. Defaults to "1.5.1" (Gateway API v1.5.1).
                type: string
              values:
                description: Helm values merged on top of chart defaults.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              overrideAllValues:
                description: Helm values that replace all defaults entirely.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - clusterName
          status:
            description: GatewayAPIStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Whether the gateway-api-crds Helm release is healthy.
                type: boolean
        required:
        - spec
